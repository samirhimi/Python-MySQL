services:
  app:
    build:
      context: ./python_apps
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_HOST: db
      MYSQL_DATABASE: appdb
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
